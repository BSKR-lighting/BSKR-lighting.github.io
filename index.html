<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSKR</title>
  <meta name="description" content="BSKR Lighting - Coming Soon">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0c10;
      color: #c5c6c7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      max-width: 100vw;
      max-height: 100vh;
    }
    .teaser-image {
      max-width: 90vw;
      max-height: 80vh;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.7));
    }
  </style>
</head>
<body>
  <main class="container">
    <img 
      src="assets/images/teaserimage.png" 
      alt="BSKR Lighting" 
      class="teaser-image"
    >
  </main>
</body>
</html>
