<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSKR</title>
  <meta name="description" content="BSKR Lighting - Coming Soon">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #c5c6c7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      max-width: 100vw;
      max-height: 85vh;
    }
    .teaser-image {
      max-width: 90vw;
      max-height: 75vh;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.7));
    }
    .footer {
      position: absolute;
      bottom: 1.5rem;
      font-size: 0.8rem;
      color: #555a64;
      letter-spacing: 0.05em;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="container">
    <img 
      src="teaserimage.png" 
      alt="BSKR Lighting" 
      class="teaser-image"
    >
  </main>
  <footer class="footer">
    &copy; 2026 Christopher Moore / BSKR Lighting. All rights reserved.
  </footer>
</body>
</html>
